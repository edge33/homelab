services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls4@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    container_name: sonarr
    restart: unless-stopped

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome

    volumes:
      - "./config:/config"
      - "${SONARR_DATA_PATH:?Set SONARR_DATA_PATH in .env}:/downloads"

    ports:
      - "8989:8989"
