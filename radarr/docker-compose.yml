services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls326@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    container_name: radarr
    restart: unless-stopped

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome

    volumes:
      - "./config:/config"
      - "${RADARR_DATA_PATH:?Set RADARR_DATA_PATH in .env}:/downloads"

    ports:
      - "7878:7878"
