services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    stop_grace_period: 60s
    mem_limit: 4g
    cpus: 2
    shm_size: 1gb

    environment:
      TZ: Europe/Rome
      HERMES_UID: ${HERMES_UID:?Set HERMES_UID in .env}
      HERMES_GID: ${HERMES_GID:?Set HERMES_GID in .env}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Set dashboard username in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Set dashboard password in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Set dashboard session secret in .env}

    ports:
      - "${HERMES_BIND_IP:-0.0.0.0}:9119:9119"
      - "${HERMES_BIND_IP:-0.0.0.0}:9120:9120"

    volumes:
      - "./data:/opt/data"
