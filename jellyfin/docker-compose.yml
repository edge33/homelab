services:
  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host

    environment:
      TZ: Europe/Rome
      # Preserve the existing host's legacy Intel VA-API driver selection.
      LIBVA_DRIVER_NAME: i965

    volumes:
      - "./config:/config"
      - "./cache:/cache"
      - "${JELLYFIN_MEDIA_PATH:?Set JELLYFIN_MEDIA_PATH in .env}:/media"

    devices:
      - /dev/dri:/dev/dri
