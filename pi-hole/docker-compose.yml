services:
  pihole:
    image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
    container_name: pihole
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
      - "8443:443/tcp"

    environment:
      TZ: Europe/Rome
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASSWORD:?Set PIHOLE_WEB_PASSWORD in .env}
      FTLCONF_dns_listeningMode: ALL

    volumes:
      - "${PIHOLE_CONFIG_PATH:?Set PIHOLE_CONFIG_PATH in .env}:/etc/pihole"
