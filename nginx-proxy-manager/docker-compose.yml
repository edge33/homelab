services:
  npm:
    image: jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1
    container_name: nginx-proxy-manager
    restart: unless-stopped

    environment:
      TZ: Europe/Rome

    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - "./data:/data"
      - "./letsencrypt:/etc/letsencrypt"
