services:
  npm:
    image: jc21/nginx-proxy-manager:2.17.0@sha256:91277490a919c792aa73b8d291af1ca84d32be74df988e543137976515763534
    container_name: nginx-proxy-manager
    restart: unless-stopped

    environment:
      TZ: Europe/Rome

    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - "./data:/data"
      - "./letsencrypt:/etc/letsencrypt"
