services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: homeassistant
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    network_mode: host

    environment:
      TZ: Europe/Rome

    volumes:
      - "./config:/config"
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
