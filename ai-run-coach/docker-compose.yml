services:
  hub:
    image: ghcr.io/edge33/ai-run-coach:v0.2.0@sha256:837f1821dd2a1e45ade3e03afca6f60b2d268a84b9640a2dd49bb8f6b83a5161
    restart: unless-stopped
    container_name: ai-run-coach
    environment:
      APP_ORIGINS: ${APP_ORIGINS:?Set APP_ORIGINS in .env}
      GARMIN_API_KEY: ${GARMIN_API_KEY:-}
      ATHLETE_TIMEZONE: ${ATHLETE_TIMEZONE:-Europe/Rome}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GARMIN_REQUEST_INTERVAL_MS: ${GARMIN_REQUEST_INTERVAL_MS:-1000}
    ports:
      - "${BIND_IP:-127.0.0.1}:8082:8080"
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
