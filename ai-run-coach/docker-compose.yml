services:
  hub:
    image: ghcr.io/edge33/ai-run-coach:v0.1.2@sha256:22a398f7d1158594efd42e9b67c3259547ff16930513420643d115d50e777a8e
    restart: unless-stopped
    environment:
      APP_ORIGINS: ${APP_ORIGINS:?Set APP_ORIGINS in .env}
      GARMIN_API_KEY: ${GARMIN_API_KEY:-}
      ATHLETE_TIMEZONE: ${ATHLETE_TIMEZONE:-Europe/Rome}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GARMIN_REQUEST_INTERVAL_MS: ${GARMIN_REQUEST_INTERVAL_MS:-1000}
    ports:
      - "${BIND_IP:-127.0.0.1}:8082:8080"
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
