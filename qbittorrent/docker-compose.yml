services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:20.04.1@sha256:fc98c8af048936d0070dc5e5992feab08664f8a61a860d91be02f782f8721485
    container_name: qbittorrent

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881

    volumes:
      - "${QBITTORRENT_CONFIG_PATH:?Set QBITTORRENT_CONFIG_PATH in .env}:/config"
      - "${QBITTORRENT_DOWNLOADS_PATH:?Set QBITTORRENT_DOWNLOADS_PATH in .env}:/downloads"

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    restart: unless-stopped
