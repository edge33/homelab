services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:14.3.9@sha256:751f377e7bcfe8e7aee1d219049720690510f488bba649f8ceffcd911e83d908
    container_name: qbittorrent

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881

    volumes:
      - "${QBITTORRENT_CONFIG_PATH:?Set QBITTORRENT_CONFIG_PATH in .env}:/config"
      - "${QBITTORRENT_DOWNLOADS_PATH:?Set QBITTORRENT_DOWNLOADS_PATH in .env}:/downloads"

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    restart: unless-stopped
