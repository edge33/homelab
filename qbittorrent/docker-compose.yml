services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    container_name: qbittorrent

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Rome
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881

    volumes:
      - "${QBITTORRENT_CONFIG_PATH:?Set QBITTORRENT_CONFIG_PATH in .env}:/config"
      - "${QBITTORRENT_DOWNLOADS_PATH:?Set QBITTORRENT_DOWNLOADS_PATH in .env}:/downloads"

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    restart: unless-stopped
