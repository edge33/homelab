services:
  samba:
    image: dperson/samba:latest@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    container_name: samba
    restart: unless-stopped

    ports:
      - "445:445"
      - "139:139"

    volumes:
      - "${SAMBA_SHARE_PATH:?Set SAMBA_SHARE_PATH in .env}:/mount/share"
      - samba_etc:/etc
      - samba_cache:/var/cache/samba
      - samba_lib:/var/lib/samba
      - samba_log:/var/log/samba
      - samba_run:/run/samba

    environment:
      USERID: 1000
      GROUPID: 1000

    command: >
      -p
      -u "${SAMBA_USER:?Set SAMBA_USER in .env};${SAMBA_PASSWORD:?Set SAMBA_PASSWORD in .env}"
      -s "drive-name;/mount/share;yes;no;no;${SAMBA_USER:?Set SAMBA_USER in .env}"

volumes:
  samba_etc:
    name: samba_etc
  samba_cache:
    name: samba_cache
  samba_lib:
    name: samba_lib
  samba_log:
    name: samba_log
  samba_run:
    name: samba_run
